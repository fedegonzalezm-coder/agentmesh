[tool.poetry]
name = "agentmesh"
version = "0.1.0"
description = "Multi-agent framework with persistent expert sessions and context isolation — MCP server for Claude Code"
authors = []
license = "MIT"
readme = "README.md"
homepage = "https://github.com/agentmesh/agentmesh"
repository = "https://github.com/agentmesh/agentmesh"
keywords = ["ai", "agents", "mcp", "claude", "multi-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

packages = [{ include = "agentmesh" }]

[tool.poetry.dependencies]
python = ">=3.10"
mcp = ">=1.0.0"
click = ">=8.0"
pyyaml = ">=6.0"
pydantic = ">=2.0"

[tool.poetry.extras]
# Optional: direct Anthropic API access instead of claude CLI
api = ["anthropic"]

[tool.poetry.dev-dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
ruff = ">=0.1"

[tool.poetry.scripts]
agentmesh = "agentmesh.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
